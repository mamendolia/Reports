<style>
/* Layout: impostazioni in alto, poi totale gruppo → per tenant → top generale → top per tenant → dettagli → qualità dati */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#151a2b; --muted:#5d6479; --line:#dde0e8;
  --accent:#1f45c7; --accent-soft:#e6ecfc;
  --ok:#1d7a4c; --ok-soft:#e2f3ea; --warn:#a15c00; --warn-soft:#fbefd9; --bad:#b4232c; --bad-soft:#fbe4e5;
  --f-display:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:Consolas,ui-monospace,Menlo,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1220; --surface:#171b2c; --ink:#e7e9f2; --muted:#9aa1b8; --line:#2a3048;
    --accent:#7d9bff; --accent-soft:#1f2a52;
    --ok:#5fd19a; --ok-soft:#14352a; --warn:#f0b357; --warn-soft:#3a2b12; --bad:#ff8a8f; --bad-soft:#3d1a1e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2c; --ink:#e7e9f2; --muted:#9aa1b8; --line:#2a3048;
  --accent:#7d9bff; --accent-soft:#1f2a52;
  --ok:#5fd19a; --ok-soft:#14352a; --warn:#f0b357; --warn-soft:#3a2b12; --bad:#ff8a8f; --bad-soft:#3d1a1e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 64px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:27px;font-weight:700} h2{font-size:21px;font-weight:600} h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.ver{font-family:var(--f-mono);font-size:13px;font-weight:400;color:var(--muted)}
.sub{color:var(--muted);max-width:75ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
input[type=date],input[type=number],input[type=text],input[type=search],textarea,select{
  font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical;font-family:var(--f-mono);font-size:12px}
input[type=file]{font-size:13px;color:var(--muted);max-width:100%}
.row2{display:flex;gap:8px}
.row2 input{min-width:0;flex:1 1 0;padding-left:6px;padding-right:4px}
.checklist{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400;cursor:pointer;padding:2px 0}
.checklist label span.c{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.checklist input{margin-top:3px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{font:inherit;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--accent);cursor:pointer}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner{padding:10px 14px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.banner.sample{background:var(--warn-soft);color:var(--warn)}
nav.jump{display:flex;flex-wrap:wrap;gap:6px}
nav.jump a{font-size:13px;color:var(--accent);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
nav.jump a:hover{border-color:var(--accent)}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-left-width:4px}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .det{font-size:12.5px;color:var(--muted)}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.bad{border-left-color:var(--bad)} .kpi.neutral{border-left-color:var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.nis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.nis{display:flex;flex-direction:column;gap:10px}
.nis .art{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.nis dl{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:4px 12px;margin:0;font-size:14px}
.nis dt{color:var(--muted)} .nis dd{margin:0;text-align:right;max-width:210px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;font-weight:500}
.tbl-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tbl-wrap.tall{max-height:520px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.tw{white-space:normal;min-width:320px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;z-index:1}
th.n,td.n{text-align:right}
tbody tr:last-child td{border-bottom:none}
.bar{position:relative;height:8px;width:110px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.cell-bar{display:flex;align-items:center;gap:8px}
.rank{font-family:var(--f-display);font-weight:700;font-size:18px;width:28px;display:inline-block}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
ul.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
details>summary{cursor:pointer;font-weight:600;font-size:15px}
.miles{position:relative;height:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;margin:26px 0 8px}
.miles .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:7px}
.miles .m{position:absolute;top:-24px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.miles .m.hit{color:var(--ok);font-weight:600}
.btiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.btile b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bv{fill:var(--accent)}
.chart .hit:hover+.bv,.chart g:hover .bv{fill-opacity:.8}
.chart .lbl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast,.tip{transition:none}}
@media (max-width:420px){.wrap{padding:16px 16px 48px}.kpi .val{font-size:26px}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}
.tcard .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 0}
.tcard table{font-size:13px}
.linkbtn{font:inherit;font-size:12px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
select.pmap{font-size:12.5px;padding:4px 6px;max-width:340px}
tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--bg)}
</style>
